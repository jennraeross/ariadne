# cargo-deny configuration: keep the dependency tree MIT-compatible.
# https://emabee.github.io/cargo-deny/

[graph]
targets = [
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]

[licenses]
# Allowlist: anything not listed here fails the check. This keeps the tree
# MIT-compatible — no copyleft (GPL/LGPL/AGPL) licenses are listed.
# See https://spdx.org/licenses/ for identifiers.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
  "0BSD",
  "BSL-1.0",
  "Unicode-3.0",
  "Apache-2.0 WITH LLVM-exception",
  # Font licenses for egui's embedded fonts (used as data, never modified).
  "OFL-1.1",
  "Ubuntu-font-1.0",
]
confidence-threshold = 0.8
# Weak file-level copyleft: fine to link, notices stay intact.
exceptions = [
  { allow = ["MPL-2.0"], crate = "option-ext" },
  # harper-core transitive deps (terminal colors, CSS number parsing):
  # linked unmodified, same weak-copyleft terms as above.
  { allow = ["MPL-2.0"], crate = "colored" },
  { allow = ["MPL-2.0"], crate = "cssparser" },
  { allow = ["MPL-2.0"], crate = "dtoa-short" },
]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# Unmaintained notices fail only for crates we directly depend on;
# transitive ones (egui/font/DBus stack) are out of our control.
unmaintained = "workspace"
# Ignored with justification; ignored advisories still print a note.
# Vulnerabilities always fail unless ignored here.
ignore = [
  # quick-xml 0.30 is pinned by zbus_xml/wayland-scanner with no fixed 0.30
  # release. In this app it parses only local build-time Wayland protocol
  # files and local D-Bus introspection XML — no untrusted input.
  { id = "RUSTSEC-2026-0194", reason = "no fixed 0.30 release; local-only XML input" },
  { id = "RUSTSEC-2026-0195", reason = "no fixed 0.30 release; local-only XML input" },
  # zip 8.6.0 is pinned by harper-core, which uses it only to read its own
  # bundled linguistic data into memory (weirpack); the app never extracts
  # archives to disk, so extraction advisories are unreachable.
  { id = "RUSTSEC-2026-0367", reason = "harper-core reads bundled data in-memory; no archive extraction" },
  { id = "RUSTSEC-2026-0368", reason = "harper-core reads bundled data in-memory; no archive extraction" },
  { id = "RUSTSEC-2026-0369", reason = "harper-core reads bundled data in-memory; no archive extraction" },
  { id = "RUSTSEC-2026-0429", reason = "harper-core reads bundled data in-memory; no archive extraction" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
