# cargo-deny configuration: keep the dependency tree MIT-compatible.
# https://emabee.github.io/cargo-deny/

[graph]
targets = [
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]

[licenses]
unlicensed = "deny"
# Copyleft of any strength is rejected; everything else allowlisted below.
copyleft = "deny"
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
  "0BSD",
  "BSL-1.0",
  "Unicode-3.0",
  "Apache-2.0 WITH LLVM-exception",
  # Font licenses for egui's embedded fonts (used as data, never modified).
  "OFL-1.1",
  "Ubuntu-font-1.0",
]
# Weak file-level copyleft: fine to link, notices stay intact.
exceptions = [
  { name = "option-ext", allow = ["MPL-2.0"] },
]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
unmaintained = "warn"
unsound = "warn"

[bans]
multiple-versions = "warn"
wildcards = "deny"
