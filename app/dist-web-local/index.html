<body>
  <canvas id="ariadne_canvas"></canvas>
  <div id="ariadne_loading">Loading Ariadne…</div>
  <noscript>Ariadne's browser build needs JavaScript and WebAssembly.</noscript>
  <script>
    (function () {
      // Hide the loader once the canvas paints its first frame.
      var canvas = document.getElementById("ariadne_canvas");
      var loader = document.getElementById("ariadne_loading");
      if (!canvas || !loader) return;
      var hidden = false;
      function hide() {
        if (!hidden) {
          hidden = true;
          loader.remove();
        }
      }
      // Fallback: never trap the user behind the loader.
      setTimeout(hide, 15000);
      try {
        var observer = new MutationObserver(hide);
        observer.observe(canvas, { attributes: true, attributeFilter: ["width"] });
      } catch (e) {
        setTimeout(hide, 3000);
      }
      canvas.addEventListener("webglcontextlost", function (e) {
        e.preventDefault();
        document.body.innerHTML =
          "<p style=\"color:#c9c9c9;font-family:system-ui;padding:2em\">Ariadne lost its graphics context. Please reload the page.</p>";
      });
    })();
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(function () {});
      });
    }
  </script>
