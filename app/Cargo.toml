[package]
name = "ariadne"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Ariadne — a pure-Rust, cross-platform writing workspace"
homepage = "https://github.com/jennraeross/ariadne"
repository = "https://github.com/jennraeross/ariadne"

[dependencies]
eframe = { version = "0.31", default-features = true }
egui = "0.31"
egui-phosphor = "0.9"
directories = "6"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
rfd = { version = "0.15", optional = true }
arboard = "3"
# Google Drive sync (background thread, blocking I/O; no async runtime).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
oauth2 = { version = "5", features = ["reqwest-blocking"] }
tiny_http = "0.12"
keyring = "3"
url = "2"
md5 = "0.7"
# PDF font embedding (subsetted OpenType) + system font discovery. Both are
# pure Rust; pinned exact while krilla is pre-1.0.
krilla = { version = "=0.8.2", default-features = false, features = ["simple-text", "raster-images"] }
fontdb = "=0.24.0"

[features]
default = ["dialogs"]
dialogs = ["dep:rfd"]

[dev-dependencies]
egui_kittest = { version = "0.31", features = ["eframe"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[package.metadata.deb]
maintainer = "Jenn Royleance <jenn.rae.ross@gmail.com>"
copyright = "2026, Jenn Royleance"
section = "editors"
depends = "$auto, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0"
extended-description = """\
A pure-Rust, cross-platform writing workspace: library and sheets sidebar, \
Markdown editing with live counts, and styled export to Markdown, HTML, PDF, \
Word, Rich Text, and ePub."""
assets = [
  "$auto",
  ["assets/ariadne.desktop", "usr/share/applications/", "644"],
  ["assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/ariadne.png", "644"],
]

[profile.release]
opt-level = 2
